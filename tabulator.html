.brand{position:relative;z-index:1;display:flex;align-items:center;gap:14px;min-width:0}
.torch{flex:none;height:104px;width:auto}
.brand h1{margin:0;font-size:clamp(28px,4.2vw,46px);font-style:italic;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff3b0,#f8c945 60%,#d98a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.brand p{margin:6px 0 0;font-weight:700;font-style:italic;font-size:14px}
.seal-wrap{flex:none}
.seal{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a00 60%,#8a5a00);display:grid;place-items:center;border:3px solid #fde08a;font-weight:800;color:#3b0f8c;font-size:12px}
.seal-wrap img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.department-banners{position:relative;z-index:1;display:flex;gap:14px;align-items:flex-start;align-self:flex-start;margin-top:-16px}
.pennant{width:108px;height:142px;padding:12px 6px 0;text-align:center;color:#fff;font-weight:600;font-size:11px;line-height:1.15;border-top:5px solid var(--gold);
  clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.pennant .em{font-size:22px;line-height:1;margin-bottom:2px}
.pennant b{display:block;font-size:19px;font-weight:800}
.pennant svg{display:block;margin:7px auto 0}
.pn-BSBA{background:linear-gradient(180deg,#1d5bff,#0a2a8a)}
.pn-BSIT{background:linear-gradient(180deg,#8f3be0,#4c1d95)}
.pn-BEEd{background:linear-gradient(180deg,#e0294a,#7f1020)}
.pennant-wrap img{height:150px;width:auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
a.hbtn{text-decoration:none;display:inline-block}
.user-controls{position:relative;z-index:1;display:flex;gap:10px}
.hbtn{border:0;background:#fff;color:var(--ink);font:700 15px inherit;padding:11px 24px;border-radius:999px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hbtn:hover{background:var(--lavender)}

/* ---------- layout ---------- */
.app-layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 150px)}
.sidebar{position:relative;overflow:hidden;background:linear-gradient(180deg,#32158b,#1c226e);color:#fff;padding:24px 12px}
.sidebar .crowd{position:absolute;left:0;bottom:0;width:100%;opacity:.35;pointer-events:none}
.sidebar nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.sidebar button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:#fff;font:600 16px inherit;padding:13px 16px;border-radius:12px;cursor:pointer;text-align:left}
.sidebar button svg{width:22px;height:22px;flex:none}
.sidebar button:hover{background:rgba(255,255,255,.12)}
.sidebar button.on{background:linear-gradient(180deg,#8f3be0,#6a1fb4);box-shadow:0 0 0 2px var(--gold)}
.main-content{position:relative;min-width:0;padding:16px 24px 32px}.cheer{position:absolute;top:-6px;right:34px;height:88px;opacity:.55;pointer-events:none}
.strip{display:flex;justify-content:center;align-items:flex-end;gap:34px;margin-top:22px;opacity:.55;pointer-events:none}.strip img{height:70px;width:auto}
.content-panel{position:relative;isolation:isolate;padding:24px 28px;background:rgba(255,255,255,.96);border:1px solid #e0d7ff;border-radius:28px;box-shadow:0 12px 32px rgba(42,22,108,.15)}
.mobile-nav{display:none}

/* ---------- tabs ---------- */
.main-tabs,.subtabs{display:flex;gap:8px;overflow-x:auto}
.main-tabs{margin:0 0 0 0;padding:0 0 0 8px}
.main-tab{height:44px;padding:0 22px;border:0;border-radius:14px 14px 0 0;background:#f0ecff;color:var(--ink);font:700 16px inherit;cursor:pointer;white-space:nowrap}
.main-tab.active{background:var(--purple);color:#fff;border-bottom:4px solid var(--gold)}
.main-tabs+.content-panel{border-top-left-radius:0}
.subtabs{margin-bottom:16px}
.subtab{height:36px;padding:0 18px;border:1px solid #d8cdf5;border-radius:24px;background:#fff;color:var(--ink);font:600 14px inherit;cursor:pointer;white-space:nowrap}
.subtab.active{background:var(--purple);color:#fff;border-color:var(--purple)}

.page-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-heading h2{margin:0;font-size:30px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:12px}
.page-heading h2 svg{width:34px;height:34px}
.toolbar{display:flex;gap:10px}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:999px;border:1.5px solid var(--purple);background:#fff;color:var(--purple);font:700 15px inherit;cursor:pointer}
.tbtn.fill{background:var(--purple);color:#fff}
.tbtn svg{width:18px;height:18px}

/* ---------- info panels ---------- */
.criteria-panel,.rules-panel{background:var(--lavender);border:1px solid #d8cafa;border-radius:16px;padding:16px 20px;margin-bottom:14px}
.criteria-panel h3{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:10px;color:var(--purple)}
.criteria-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.criteria-grid ul{list-style:none;margin:0;padding:0}
.criteria-grid li{position:relative;padding-left:16px;margin-bottom:8px;font-weight:600;font-size:14px}
.criteria-grid li:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--purple)}
.criteria-grid ul+ul{border-left:1px solid #cbb9f3;padding-left:16px}
.rules-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.rules-grid>div{display:flex;gap:12px}
.rules-grid>div+div{border-left:1px solid #cbb9f3;padding-left:24px}
.rules-grid .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800}
.rules-grid h4{margin:0 0 3px;font-size:17px;color:var(--purple)}
.rules-grid p{margin:0;font-size:14px}
.submission-status{display:flex;align-items:center;gap:12px;background:#fff0c8;color:#915000;padding:14px 20px;border-radius:14px;margin-bottom:14px;font-weight:600}
.submission-status b{color:#6b3a00}

/* ---------- cards ---------- */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.tcard{position:relative;border-radius:16px;padding:14px 14px 0;color:#fff;overflow:hidden;border:2px solid rgba(255,230,150,.85)}
.tcard.BSBA{background:linear-gradient(135deg,#e0a400,#a46a00)}
.tcard.BSIT{background:linear-gradient(135deg,#8f3be0,#4c1d95)}
.tcard.BEEd{background:linear-gradient(135deg,#e0294a,#7a1020)}
.tcard .head{display:flex;gap:10px;align-items:center;padding-right:44px}
.tcard .gembox{flex:none;width:64px;height:64px;display:grid;place-items:center}.tcard .gembox img{max-width:64px;max-height:64px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.tcard h3{margin:0;font-size:28px;font-weight:800;line-height:1}
.tcard small{display:block;font-size:11.5px;opacity:.92;margin-top:2px;font-weight:600;line-height:1.2}
.tcard .rank{position:absolute;right:10px;top:0;width:40px;padding:6px 0 13px;text-align:center;font-weight:800;font-size:24px;color:#3b0f8c;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.rank.r1{background:linear-gradient(180deg,#ffd75a,#e0a400)}.rank.r2{background:linear-gradient(180deg,#f1f5f9,#9aa5b8)}.rank.r3{background:linear-gradient(180deg,#f0b27a,#b8672a)}
.tcard .stats{display:grid;grid-template-columns:repeat(4,1fr);margin:12px -14px 0;background:rgba(0,0,0,.3);text-align:center;padding:8px 0}
.tcard .stats div+div{border-left:1px solid rgba(255,255,255,.25)}
.tcard .stats b{display:block;font-size:26px;line-height:1.1}.tcard .stats span{font-size:12px;font-weight:600}

/* ---------- tables ---------- */
.results-wrapper{overflow-x:auto;border:1px solid #d9cef6;border-radius:16px}
.results-table{width:100%;min-width:760px;border-collapse:collapse}
.results-table.wide{min-width:950px}
.results-table th{background:#e9e2fa;color:var(--ink);font-size:13px;padding:12px 8px;white-space:nowrap;text-transform:none}
.results-table td{padding:10px 8px;border-top:1px solid #e1d9f5;text-align:center;font-weight:600;background:#fff}
.results-table tbody tr:nth-child(even) td{background:#f8f6ff}
td.l,th.l{text-align:left}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:4px;border:2px solid rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.g{background:radial-gradient(circle at 35% 30%,#ffe680,#e0a400)}.s{background:radial-gradient(circle at 35% 30%,#fff,#9aa5b8)}.b{background:radial-gradient(circle at 35% 30%,#f4b883,#b8672a)}
.pill{display:inline-block;min-width:76px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.pill.BSBA{background:linear-gradient(180deg,#f0b400,#b57c00)}.pill.BSIT{background:linear-gradient(180deg,#8f3be0,#4c1d95)}.pill.BEEd{background:linear-gradient(180deg,#e11d48,#9f1239)}
.prog{display:inline-flex;align-items:center;gap:10px}.prog img{height:34px;width:auto}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--lavender);color:var(--purple);font-weight:800}
.rk{display:inline-grid;place-items:center;width:34px;height:38px;font-weight:800;color:#fff;clip-path:polygon(50% 0,100% 15%,100% 70%,50% 100%,0 70%,0 15%)}
.rk1{background:linear-gradient(180deg,#ffd75a,#c98e00)}.rk2{background:linear-gradient(180deg,#e5e9f0,#8c97ab)}.rk3{background:linear-gradient(180deg,#f0b27a,#a85a1f)}
.tot{font-size:20px;font-weight:800;color:var(--purple)}
.evn b{display:block;font-size:15px}.evn small{color:var(--muted);font-weight:600;font-size:12px}
.chip{display:inline-block;padding:3px 13px;border-radius:999px;background:var(--lavender);color:var(--purple);font-weight:700;font-size:13px}
.pend{color:#b3a9d1;font-weight:700}
.exp{border:0;background:none;color:var(--purple);cursor:pointer;font-size:18px;padding:2px 8px;border-radius:8px}
.xrow td{background:#fbf9ff!important;text-align:left;font-weight:500;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gc{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.gc h4{margin:0 0 6px;font-size:15px}.gc .pl{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;font-weight:600}
.bar-t{height:10px;background:#e9e2fa;border-radius:6px;overflow:hidden;min-width:120px}.bar-t i{display:block;height:100%;background:linear-gradient(90deg,#8f3be0,#6a1fb4)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
select,input[type=text],textarea{padding:9px 14px;border:1px solid #cfc2ee;border-radius:10px;font:600 14px inherit;background:#fff;color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--amethyst);box-shadow:0 0 0 3px rgba(143,59,224,.2)}
.search{margin-left:auto;display:flex;border:1px solid #cfc2ee;border-radius:10px;overflow:hidden;background:#fff}
.search input{border:0;border-radius:0;min-width:200px;box-shadow:none!important}.search button{border:0;background:var(--purple);color:#fff;padding:0 16px;cursor:pointer}
.vt{display:flex;border-radius:10px;overflow:hidden;background:var(--purple)}.vt button{border:0;background:none;color:#fff;padding:8px 14px;cursor:pointer;opacity:.6}.vt button.on{background:#4a1388;opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:14px;font-weight:600}
.pg{display:flex;gap:6px;align-items:center}
.pg button{min-width:36px;height:36px;border-radius:9px;border:1px solid #d8cdf5;background:#fff;font:700 14px inherit;color:var(--ink);cursor:pointer}
.pg button.on{background:var(--purple);color:#fff;border-color:var(--purple)}.pg button:disabled{opacity:.4;cursor:default}
.goto input{width:56px;text-align:center;padding:7px}
.btn{border:0;background:var(--purple);color:#fff;padding:10px 18px;border-radius:10px;font:700 14px inherit;cursor:pointer}
.btn.alt{background:var(--lavender);color:var(--purple)}
.cat{display:inline-block;padding:3px 14px;border-radius:999px;font-weight:700;font-size:13px}
.c-Event{background:#ead9ff;color:#5b21b6}.c-Ceremony{background:#ffe9a8;color:#8a5a00}.c-Cheer{background:#ffd3e3;color:#be185d}.c-Racquet{background:#cfe8ff;color:#1e5a99}
.c-Basketball{background:#ffd8b8;color:#a14a07}.c-Volleyball{background:#cff5d0;color:#1d7a2b}.c-Athletics{background:#ffe2c8;color:#9a3d00}.c-Esports{background:#e0d4ff;color:#4527a0}
.c-Mind{background:#e2e8f0;color:#334155}.c-Dance{background:#ffd3f0;color:#a21caf}.c-Sepak{background:#d1fae5;color:#065f46}.c-Pageant{background:#fde2e4;color:#9f1239}
.dayhead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#fff0c8,#f1eaff);border-left:5px solid var(--gold);padding:10px 16px;border-radius:10px 10px 0 0;font-weight:800;color:var(--purple);font-size:19px}
.dayhead span{font-size:14px;background:#fff;padding:4px 14px;border-radius:999px}
.venue:before{content:"📍 ";font-size:12px}
.note{font-size:13px;color:var(--muted)}
.editbanner{background:#fff0c8;color:#915000;padding:12px 18px;border-radius:14px;margin-bottom:14px;font-weight:600}
.ev3{display:grid;grid-template-columns:1.8fr repeat(3,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev3 small{color:var(--muted);font-weight:600}
.faq h4{margin:14px 0 4px;color:var(--purple)}.faq p{margin:0}

async function sbSet(eid,k,val){if(!SBON)return;pend++;rev++;try{await sbRpc("siglakas_set",{p:getPin(),eid:eid,k:k,val:val||""});setSync(true)}catch(e){authFail(e)}finally{pend--}}
async function sbPull(){if(!SBON||MODE!=="admin"||!ST.auth||pend)return;const my=rev;
  try{const r=await fetch(SB_URL+"/rest/v1/siglakas_results?id=eq.1&select=results",{headers:{apikey:SB_KEY},cache:"no-store"});if(!r.ok)throw 0;const a=await r.json();const sv=a[0]&&a[0].results;if(!sv)throw 0;
    if(pend||my!==rev)return;if(!pulled&&!Object.keys(sv).length&&Object.keys(results).length){pulled=true;await sbPush();return}
    pulled=true;setSync(true);

// ---------- data ----------
function tally(cat){
  const t={};PROGRAMS.forEach(p=>t[p.id]={id:p.id,g:0,s:0,b:0,pts:0});
  E.filter(e=>cat==="all"||e.cat===cat).forEach(ev=>{const r=results[ev.id];if(!r)return;
    ["g","s","b"].forEach(k=>{if(r[k]&&t[r[k]]){t[r[k]][k]+=ev.w;t[r[k]].pts+=ev.w}})});
  const a=Object.values(t).sort((x,y)=>y.g-x.g||y.s-x.s||y.b-x.b||PROGRAMS.findIndex(p=>p.id===x.id)-PROGRAMS.findIndex(p=>p.id===y.id));
  let rank=0;a.forEach((x,i)=>{const p=a[i-1];x.total=x.g+x.s+x.b;
    if(!p||p.g!==x.g||p.s!==x.s||p.b!==x.b)rank=i+1;x.rank=rank});
  return a;
}
const isDone=e=>{const r=results[e.id];return !!(r&&r.g&&r.s&&r.b)};
const evs=cat=>E.filter(e=>cat==="all"||e.cat===cat);
const doneCount=cat=>evs(cat).filter(isDone).length;

function csv(rows){return rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n")}
function download(name,text,type){
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type||"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
}
function exportStandings(){const T=tally(ST.cat);download("siglakas2026-standings.csv",csv([["Rank","Program","Gold","Silver","Bronze","Total"],...T.map(x=>[x.rank,x.id,x.g,x.s,x.b,x.pts])]))}
function exportResults(){download("siglakas2026-event-results.csv",csv([["#","Event","Date","Category","Sport","Gold","Silver","Bronze"],...E.map((e,i)=>{const r=results[e.id]||{};return [i+1,e.name,e.day,CATNAME[e.cat],e.sport,r.g||"",r.s||"",r.b||""]})]))}

// ---------- components ----------
function heading(icon,title,withTools,which){
  return `<div class="page-heading"><h2>${icon}${title}</h2>${withTools?`<div class="toolbar"><button class="tbtn" data-act="csv-${which}">${I.dl}Download CSV</button><button class="tbtn fill" data-act="print">${I.print}Print</button></div>`:""}</div>`;
}
function status(cat){
  const total=evs(cat).length,d=doneCount(cat);
  return `<div class="submission-status">👥 <span><b>${d} of ${total} events have final results.</b> Counts use posted results only.${MODE==="public"&&PUBLISHED?` <small>Updated ${PUBLISHED}</small>`:""}</span></div>`;
}
function ruleBoxes(){
  return `<div class="rules-panel"><div class="rules-grid">
   <div><div class="ic">i</div><div><h4>Medal Counting Rule</h4><p>Medals are counted by value: an individual-sport medal counts as 1, a team of 2 to 4 participants counts as 3 (a gold in Sepak Takraw adds 3 golds), and a team of 5 or more participants counts as 5. Total is the sum of gold, silver and bronze.</p></div></div>
   <div><div class="ic">▤</div><div><h4>Tie-Breaking Rule</h4><p>Programs are ranked by the number of golds. Ties are broken by the higher silver count, then bronze.</p></div></div></div></div>`;
}
function pager(total,page,per,key,perOpts,label){
  const pages=Math.max(1,Math.ceil(total/per));if(page>pages)page=pages;
  const from=total?(page-1)*per+1:0,to=Math.min(total,page*per);
  let nums=[];for(let i=1;i<=pages;i++){if(i<=3||i>pages-1||Math.abs(i-page)<=1)nums.push(i);else if(nums[nums.length-1]!=="…")nums.push("…")}
  return `<div class="pager"><div>Showing ${from} to ${to} of ${total} ${label}</div>
  <div class="pg"><button data-pg="${key}:1" ${page<=1?"disabled":""}>«</button><button data-pg="${key}:${page-1}" ${page<=1?"disabled":""}>‹</button>
  ${nums.map(n=>n==="…"?"<span>…</span>":`<button data-pg="${key}:${n}" class="${n===page?"on":""}">${n}</button>`).join("")}
  <button data-pg="${key}:${page+1}" ${page>=pages?"disabled":""}>›</button><button data-pg="${key}:${pages}" ${page>=pages?"disabled":""}>»</button></div>
  ${perOpts?`<div>Show per page: <select id="per">${perOpts.map(o=>`<option ${o===per?"selected":""}>${o}</option>`).join("")}</select></div>`:`<div class="goto">Go to page: <input type="text" id="gt" value="${page}"> <button class="btn" id="gtb">Go</button></div>`}</div>`;
}
const mainTabs=(items,cur,attr)=>`<div class="main-tabs">${items.map(([v,l])=>`<button class="main-tab ${v===cur?"active":""}" data-${attr}="${v}">${l}</button>`).join("")}</div>`;
const subTabs=(items,cur,attr)=>`<div class="subtabs">${items.map(([v,l])=>`<button class="subtab ${v===cur?"active":""}" data-${attr}="${v}">${l}</button>`).join("")}</div>`;

    const cards=T.map(x=>{const p=PROGRAMS.find(q=>q.id===x.id);return `<div class="tcard ${x.id}"><div class="rank r${Math.min(x.rank,3)}">${x.rank}</div>

    body=`<div class="criteria-panel"><h3>🏅 Medal Value</h3><div class="criteria-grid">

  return `<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGLAKAS 2026 | Medal Tally</title><link rel="icon" type="image/png" href="${FAVICON}">
<style>${css}</style></head><body><div class="bottomrib"></div><img class="gemL" src="${IMG["gem-purple"]}" alt=""><img class="gemR" src="${IMG["gem-red"]}" alt=""><main class="stage"><div class="wave l"></div><div class="wave r"></div><img class="sil a" src="${IMG["sil-bball"]}" alt=""><img class="sil b" src="${IMG["sil-run"]}" alt=""><img class="sil c" src="${IMG["sil-vball"]}" alt=""><img class="sil d" src="${IMG["sil-run"]}" alt="">
<img class="omsu" src="${IMG["seal-omsu"]}" alt="Occidental Mindoro State University seal"><div class="shell"><div class="topline">OCCIDENTAL MINDORO STATE UNIVERSITY · LUBANG CAMPUS</div><div class="mast"><img class="torch" src="${IMG.torchrings}" alt=""><h1>SIGLAKAS 2026</h1></div><div class="badgewrap">${branchSVG(false)}<div class="badge">OFFICIAL MEDAL TALLY DISPLAY</div>${branchSVG(true)}</div><div class="meta" id="meta">As of ${asOf} · Snapshot · updates live when connected to the tabulator</div><section class="cards" aria-label="Department medal counts">${rows.map(card).join("")}</section><div class="footer">SIGLAKAS 2026 · OMSU LUBANG CAMPUS · PUBLIC VIEWING DISPLAY</div></div></main>${script}${liveJs}</body></html>
`;
}
function publicRows(){return tally("all").map(x=>({id:x.id,g:x.g,s:x.s,b:x.b,rank:x.rank}))}
const nowStr=()=>new Date().toLocaleString("en-PH",{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
function previewPublic(){
  const d=document.createElement("div");d.id="pv";d.style.cssText="position:fixed;inset:0;z-index:100;background:#0b0f3a;display:flex;flex-direction:column";
  d.innerHTML='<div style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700">Public page preview (static snapshot)<button class="btn" id="pvx">Close</button></div><iframe style="flex:1;border:0;width:100%"></iframe>';
  document.body.appendChild(d);d.querySelector("iframe").srcdoc=staticHTML(publicRows(),nowStr());d.querySelector("#pvx").onclick=()=>d.remove();
}
function setupHeader(){
  $("#uc").innerHTML=MODE==="admin"?'<a class="hbtn" href="'+PUBLIC_URL+'">View public page</a>':'';
}
async function loadPublished(){
  try{const r=await fetch(RESULTS_URL+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const o=await r.json();
    if(o&&typeof o==="object"){results=o.results&&typeof o.results==="object"?o.results:o;PUBLISHED=o.updated||"";return true}}catch(e){}
  return false;
}
let PUBLISHED="";
function render(){
  const nav=NAV.map(([k,l,i])=>`<button data-go="${k}" class="${ST.page===k?"on":""}">${i}${l}</button>`).join("");
  $("#snav").innerHTML=nav;
  $("#mnav").innerHTML=NAV.map(([k,l])=>`<button data-go="${k}" class="${ST.page===k?"on":""}">${l}</button>`).join("");
  $("#tabs").innerHTML="";
  const html={standings:pageStandings,results:pageResults,schedule:pageSchedule,rules:pageRules,admin:pageAdmin,help:pageHelp}[ST.page]();
  $("#view").innerHTML=html;
  wire();
}
function keepFocus(id){const n=$(id);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
function wire(){
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ST.cat=b.dataset.cat;render()});
  document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{ST.sub=b.dataset.sub;render()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ST.day=b.dataset.day;ST.pg=1;render()});
  document.querySelectorAll("[data-ecat]").forEach(b=>b.onclick=()=>{ST.ecat=b.dataset.ecat;ST.pg=1;render()});
  document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{ST.sday=+b.dataset.sd;ST.spg=1;render()});
  const fs=$("#fSport");if(fs)fs.onchange=()=>{ST.sport=fs.value;ST.pg=1;render()};
  const q=$("#q");if(q){const go=()=>{ST.q=q.value;ST.pg=1;render();keepFocus("#q")};q.onkeydown=e=>{if(e.key==="Enter")go()};on("#qb",go)}
  const sq=$("#sq");if(sq){const go=()=>{ST.sq=sq.value;ST.spg=1;render();keepFocus("#sq")};sq.onkeydown=e=>{if(e.key==="Enter")go()};on("#sqb",go)}
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ST.mode=b.dataset.m;render()});
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ST.open[b.dataset.x]=!ST.open[b.dataset.x];render()});
  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{const[k,n]=b.dataset.pg.split(":");if(k==="p")ST.pg=+n;else ST.spg=+n;render()});
  const per=$("#per");if(per)per.onchange=()=>{ST.sper=+per.value;ST.spg=1;render()};
  on("#gtb",()=>{const n=parseInt($("#gt").value);if(n>0){ST.pg=n;render()}});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;if(a==="print")window.print();
    else if(a==="csv-standings")exportStandings();else if(a==="csv-results")exportResults();
    else if(a==="csv-sched"){const d=SCHEDULE[ST.sday];download("siglakas2026-schedule.csv",csv([["Day","Time","Activity","Venue"],...d[1].map(r=>[d[0],r[0],r[1].replace(/&amp;/g,"&"),r[4].replace(/&amp;/g,"&")])]))}
  });
  const pinGo=async()=>{const v=($("#pin")||{}).value||"";let ok=false;
    if(SBON){$("#pinMsg").textContent="Checking…";try{ok=await sbRpc("siglakas_check",{p:v})}catch(e){$("#pinMsg").textContent="Can't reach the online database. Check your internet connection.";return}}
    else ok=(v===PIN);
    if(ok){ST.auth=true;try{sessionStorage.setItem("siglakas-auth","1");sessionStorage.setItem("siglakas-pin",v)}catch(e){}render();sbPull()}else $("#pinMsg").textContent="Incorrect PIN."};
  on("#pinGo",pinGo);const pn=$("#pin");if(pn)pn.onkeydown=e=>{if(e.key==="Enter")pinGo()};
  on("#signout",()=>{ST.auth=false;try{sessionStorage.removeItem("siglakas-auth");sessionStorage.removeItem("siglakas-pin")}catch(e){}render()});
  on("#pubDl",()=>{const txt=staticHTML(publicRows(),nowStr());download("index.html",txt,"text/html");$("#iomsg").textContent="Downloaded index.html. If nothing downloaded, your browser blocked it — try again from the uploaded site."});
  on("#pubPv",previewPublic);
  on("#pubJs",()=>{download("results.json",JSON.stringify({updated:nowStr(),results}),"application/json");$("#iomsg").textContent="Downloaded results.json. Upload it next to index.html to update the public page."});
  document.querySelectorAll("select[data-e]").forEach(s=>s.onchange=()=>{const id=s.dataset.e;results[id]=results[id]||{};results[id][s.dataset.k]=s.value||undefined;save();sbSet(id,s.dataset.k,s.value);render()});
  on("#exp2",()=>{const io=$("#io");io.style.display="block";io.value=JSON.stringify(results);io.select();
    try{navigator.clipboard.writeText(io.value).then(()=>{$("#iomsg").textContent="Copied to clipboard."},()=>{})}catch(e){}
    $("#iomsg").textContent="Results shown above — copy and keep them."});
  on("#imp",()=>{const io=$("#io");
    if(io.style.display==="none"||!io.value.trim()){io.style.display="block";io.value="";io.focus();$("#iomsg").textContent="Paste results, then press Import again.";return}
    try{const o=JSON.parse(io.value);if(!o||typeof o!=="object")throw 0;results=o.results&&typeof o.results==="object"?o.results:o;save();sbPush();render()}catch(e){$("#iomsg").textContent="That isn't valid exported data."}});
  const clr=$("#clr");if(clr)clr.onclick=()=>{if(clr.dataset.sure){results={};save();sbPush();render()}else{clr.dataset.sure=1;clr.textContent="Click again to confirm"}};
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){ST.page=b.dataset.go;render();window.scrollTo({top:0,behavior:"smooth"})}});
setupHeader();
(async()=>{
  if(MODE==="public"){const ok=await loadPublished();if(!ok){try{const r=localStorage.getItem(KEY);if(r)results=JSON.parse(r)||{}}catch(e){}}}
  else{ST.auth=(function(){try{return sessionStorage.getItem("siglakas-auth")==="1"}catch(e){return false}})();
    if(SBON&&ST.auth&&!getPin())ST.auth=false;
    if(!Object.keys(results).length)await loadPublished();}
  render();
  if(MODE==="admin"&&SBON){setSync(false);document.getElementById("syncst")&&(document.getElementById("syncst").textContent="● Online sync: sign in to connect");setInterval(sbPull,5000);if(ST.auth)sbPull()}
})();
</script>
</body>
</html>
